name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (make setup)
        run: make setup
      - name: Backend tests (make test)
        run: make test
        env:
          # tests never call a model; these keep a stray env from leaking in
          ANTHROPIC_API_KEY: ""
          MONGODB_URI: ""
      - name: Type check and build the frontend (make build)
        run: make build
